[versions]
agp = "9.2.1"
devtoolsKsp = "2.3.9"
kotlin = "2.2.0"
ksp = "2.3.9"
xposed = "82"
lsposed = "compat-1.1"

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
android-build-tools = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
devtools-ksp = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "devtoolsKsp" }
symbol-processing-api = { group = "com.google.devtools.ksp", name = "symbol-processing-api", version.ref = "ksp" }
xposed-api = { group = "de.robv.android.xposed", name = "api", version.ref = "xposed" }
lsposed-api = { group = "cc.meteormc", name = "lsposed-api", version.ref = "lsposed" }